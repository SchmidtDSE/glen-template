# Per-client limits on the LLM and MCP paths (glen-ops#246). Include this once,
# at the top of the app's config, outside its server block.
#
# $client_addr is the last X-Forwarded-For entry, the one HAProxy appends from
# the connection it actually received, so a client cannot choose it by sending
# its own header. In-cluster callers have no XFF and fall back to $remote_addr.
# The rates were set from proxy-log measurements (glen-template#50).
map $http_x_forwarded_for $client_addr {
    "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
    default $remote_addr;
}
limit_req_zone $client_addr zone=llm:10m rate=60r/m;
limit_req_zone $client_addr zone=mcp:10m rate=60r/m;
limit_conn_zone $client_addr zone=addr:10m;
limit_req_status 429;
limit_conn_status 429;
