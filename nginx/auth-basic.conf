# Password login on everything this server serves, for apps behind a shared
# password (glen-ops app-auth-patterns). Server context. /health turns it off in
# base.conf, and /api/llm/ in llm-token.conf, where the chat's bearer token
# replaces the saved password. The htpasswd file comes from the app's Secret,
# mounted at /etc/nginx/auth.
auth_basic "${AUTH_REALM}";
auth_basic_user_file /etc/nginx/auth/htpasswd;
