# Chat through open-llm-proxy for an app behind a sign-in proxy (oauth2-proxy),
# which already gates every request. Server context; use instead of llm.conf.
# Like llm-token.conf, every path under /v1/ is relayed and there are no rate
# limits (owner, 2026-11-08 and 2026-11-23; glen-ops#246), but there is no token
# to check: the sign-in proxy stands in front of nginx.
location /api/llm/ {
    proxy_pass ${LLM_UPSTREAM}/v1/;
    proxy_set_header Authorization "Bearer ${PROXY_KEY}";
    proxy_set_header X-Glen-App "${GLEN_APP}";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}
