# Queries through the geo-query MCP server, and the hex tiles it registers.
# Server context.
#
# The server requires a bearer token (geo-query#453); nginx attaches it, so the
# browser never holds it. X-Glen-App names the app in the server's logs.
# register_hex_tiles answers with tile URLs on the server's own address
# (MCP_TILES_SOURCE), which browsers cannot reach, so they are rewritten to this
# app's /tiles/. No connection cap: glen-charts fires a page's queries at once.
location /api/mcp {
    proxy_pass ${MCP_UPSTREAM}/mcp;
    proxy_set_header Accept-Encoding "";
    sub_filter '${MCP_TILES_SOURCE}' 'https://$host/tiles/';
    sub_filter_once off;
    sub_filter_types text/event-stream application/json;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host ${MCP_HOST};
    proxy_set_header Connection "";
    proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
    proxy_set_header X-Glen-App "${GLEN_APP}";
    proxy_set_header X-Real-IP $client_addr;
    limit_req zone=mcp burst=120 nodelay;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}

location /tiles/ {
    limit_except GET { deny all; }
    proxy_pass ${MCP_UPSTREAM}/tiles/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host ${MCP_HOST};
    proxy_set_header Connection "";
    proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
    proxy_set_header X-Glen-App "${GLEN_APP}";
    proxy_set_header X-Real-IP $client_addr;
}
