# Chat through open-llm-proxy for an app behind a password. Server context; use
# instead of llm.conf, with auth-basic.conf.
#
# The browser's chat request carries APP_TOKEN as its bearer, which replaces the
# saved password, so this location turns the password off and checks the token
# instead. render.sh derives APP_TOKEN from the htpasswd file and writes it into
# config.json, which only a signed-in user can read. Unlike llm.conf, every path
# under /v1/ is relayed and there are no rate limits: the password is the gate
# (owner, 2026-11-08 and 2026-11-23; glen-ops#246).
location /api/llm/ {
    auth_basic off;
    if ($http_authorization != "Bearer ${APP_TOKEN}") {
        return 403;
    }
    proxy_pass ${LLM_UPSTREAM}/v1/;
    proxy_set_header Authorization "Bearer ${PROXY_KEY}";
    proxy_set_header X-Glen-App "${GLEN_APP}";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}
