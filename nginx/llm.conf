# Chat through open-llm-proxy. Server context.
#
# nginx attaches the app's key, so the browser never holds it. The upstream is
# the proxy's in-cluster Service in the app's own namespace, because NRP drops
# pod traffic between namespaces and the public hostname failed ~12% of connects
# (glen-ops#73). Only two calls are relayed (glen-ops#246): POST chat/completions
# (chat and transcription) and GET models. Any other path or method under
# /api/llm/ is answered here and never reaches the proxy.
#
# 600s matches the GLEN client and the proxy's own timeout, so long agent loops
# on slow models are not cut off at this hop.
location = /api/llm/chat/completions {
    limit_except POST { deny all; }
    proxy_pass ${LLM_UPSTREAM}/v1/chat/completions;
    proxy_set_header Authorization "Bearer ${PROXY_KEY}";
    proxy_set_header X-Glen-App "${GLEN_APP}";
    proxy_set_header X-Real-IP $client_addr;
    limit_req zone=llm burst=30 nodelay;
    limit_conn addr 20;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}

location = /api/llm/models {
    limit_except GET { deny all; }
    proxy_pass ${LLM_UPSTREAM}/v1/models;
    proxy_set_header Authorization "Bearer ${PROXY_KEY}";
    proxy_set_header X-Glen-App "${GLEN_APP}";
    proxy_set_header X-Real-IP $client_addr;
    limit_req zone=llm burst=30 nodelay;
    limit_conn addr 20;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}

location /api/llm/ {
    return 404;
}
