apiVersion: apps/v1
kind: Deployment
metadata:
  name: padus
  namespace: schmidtdse
  labels:
    app: padus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: padus
  template:
    metadata:
      labels:
        app: padus
    spec:
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          # Clone YOUR app repo (the GitHub repo you created from the template).
          # Update this URL to point to your own GitHub repo:
          git clone --depth 1 https://github.com/SchmidtDSE/glen-template.git /tmp/repo
          cp /tmp/repo/index.html /usr/share/nginx/html/
          cp /tmp/repo/layers-input.json /usr/share/nginx/html/
          cp /tmp/repo/system-prompt.md /usr/share/nginx/html/
          # The shared nginx snippets (glen-ops#340). padus is the template's own
          # deployment, so it takes them from main and tries changes first. An app
          # made from the template pins a tag instead, replacing the line below with:
          #   git clone --depth 1 --branch nginx-v1 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          #   cp /tmp/glen/nginx/* /glen-nginx/
          cp /tmp/repo/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (nginx/render.sh).
        - name: GLEN_APP
          value: "padus"
        - name: LLM_UPSTREAM
          value: "http://open-llm-proxy.schmidtdse.svc.cluster.local:8002"
        - name: MCP_UPSTREAM
          value: "http://duckdb-mcp.schmidtdse.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "duckdb-mcp.schmidtdse.svc.cluster.local"
        # Same-origin MCP path: nginx proxies it to the shared server and
        # attaches the bearer token, so the browser never holds the token
        # (geo-query#453). Absolute, because GLEN does new URL(mcp_url).
        - name: MCP_SERVER_URL
          value: "https://padus.nrp-nautilus.io/api/mcp"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-tokens
              key: public
        - name: LLM_ENDPOINT
          value: "https://open-llm-proxy.nrp-nautilus.io/v1"
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: open-llm-proxy-namespace-keys
              key: public
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        - name: config-template
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: padus-config
      - name: nginx-template
        configMap:
          name: padus-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
