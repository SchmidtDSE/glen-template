<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Protected Lands</title>

    <!--
        glen core, loaded from the CDN at a release tag (core/main.js below, and
        the plugins in layers-input.json). Never use @main in a deployed app: a
        merge can change behaviour under a running page. To upgrade, move every
        glen@<tag> in both files together.
        glen core adds MapLibre, PMTiles, the chat's libraries and its own
        stylesheets itself, each pinned with its integrity hash. An app's own
        stylesheet goes after this comment, so its rules win ties.
    -->

    <style>
        /* Boot placeholder — see #boot-status in the body. */
        #boot-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: 14px/1.4 system-ui, sans-serif;
            color: #666;
            text-align: center;
        }
        #map.maplibregl-map #boot-status { display: none; }
    </style>
</head>

<body>
    <!-- Map. #boot-status is a plain-HTML placeholder so a failed module load
         reads as "stuck loading" instead of an unexplained blank page. MapLibre
         adds .maplibregl-map to this container once the map exists, which hides
         it again — no JS coordination needed. See geo-agent#343. -->
    <div id="map">
        <div id="boot-status">Loading map modules…</div>
    </div>

    <!-- Layer controls — generated by MapManager.generateMenu() -->
    <div id="menu"></div>

    <!-- Boot from CDN -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/SchmidtDSE/glen@v4.5.0/core/main.js"></script>
</body>

</html>
