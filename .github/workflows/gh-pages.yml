name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # SchmidtDSE/glen-template's own Pages site is a browser-only copy of the
      # app, built by scripts/build-wasm-copy.py: the visitor's own LLM key, and
      # geo-query's tools running in the browser on DuckDB-wasm
      # (SchmidtDSE/geo-query-wasm), so no MCP server or token is needed
      # (SchmidtDSE/geo-query#453). The condition keeps any repo made from this
      # one publishing its own app as before.
      - name: Build browser-only copy
        if: github.repository == 'SchmidtDSE/glen-template'
        run: python3 scripts/build-wasm-copy.py _site

      - name: Upload browser-only copy
        if: github.repository == 'SchmidtDSE/glen-template'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload app
        if: github.repository != 'SchmidtDSE/glen-template'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
